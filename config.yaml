baseURL: 'https://hacklaboriente.org/'
locale: 'es-es'
title: 'HACKLAB Oriente'
theme: 'papermod'
buildFuture: true
enableRobotsTXT: true
pagination:
  pagerSize: 50

params:
  env: production
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: false
  ShowBreadCrumbs: false
  ShowPostNavLinks: false
  ShowRssButtonInSectionTermList: false
  disableSpecial1stPost: true
  description: "Hacklab Oriente — colectivo de tecnología, ciberseguridad, IA y software libre en el Oriente Antioqueño."
  keywords:
    - hacklab
    - oriente antioqueño
    - ciberseguridad
    - software libre
    - tecnología
    - talleres
    - Antioquia
    - El Carmen de Viboral
    - Rionegro
    - Colombia
  author: "Hacklab Oriente"
  images:
    - img/og-default.png

  homeInfoParams:
    Title: "Hacklab Oriente"
    Content: "Espacio colaborativo de tecnología, ciberseguridad y proyectos libres."

  mainsections:
    - posts

menu:
  main:
    - identifier: inicio
      name: Inicio
      url: /
      weight: 1
    - identifier: agenda
      name: Agenda
      url: /agenda/
      weight: 10
    - identifier: quienes-somos
      name: Quiénes Somos
      url: /quienes-somos/
      weight: 30
    - identifier: memorias
      name: Memorias
      url: /memorias/
      weight: 50
